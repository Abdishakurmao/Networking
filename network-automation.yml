---
- name: Collect network device status
  hosts: network
  gather_facts: false
  connection: ansible.netcommon.network_cli

  tasks:
    - name: Gather device version
      ansible.netcommon.cli_command:
        command: show version
      register: device_version

    - name: Gather interface status
      ansible.netcommon.cli_command:
        command: show ip interface brief
      register: interface_status

    - name: Display device version
      ansible.builtin.debug:
        var: device_version.stdout

    - name: Display interface status
      ansible.builtin.debug:
        var: interface_status.stdout
