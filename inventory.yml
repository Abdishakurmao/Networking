all:
  children:
    network_devices:
      hosts:
        router1:
          # Documentation-only address. Replace with an authorized device IP or DNS name.
          ansible_host: 192.0.2.10
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        # Provide these through your shell environment; do not commit credentials.
        ansible_user: "{{ lookup('env', 'NETWORK_USERNAME') }}"
        ansible_password: "{{ lookup('env', 'NETWORK_PASSWORD') }}"
