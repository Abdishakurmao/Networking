---
all:
  children:
    cisco_ios:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lookup('env', 'ANSIBLE_NET_USERNAME') }}"
        ansible_password: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ lookup('env', 'ANSIBLE_ENABLE_PASSWORD') }}"
      children:
        routers:
          hosts:
            router1:
              # Replace with the device's management IP or DNS name.
              ansible_host: 192.0.2.10
        switches:
          hosts:
            switch1:
              # Replace with the device's management IP or DNS name.
              ansible_host: 192.0.2.20
